# Configuracoes do Banco de Dados
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/acheimontador?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracoes do Hibernate / JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuracoes da aplicacao e documentacao
springdoc.override-with-generic-response=false
spring.application.name=AcheiMontador

# Seguranca / JWT: defina JWT_SECRET no ambiente
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION_MILLIS:28800000}
