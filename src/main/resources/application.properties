# Configuracoes do Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/acheimontador}
spring.datasource.username=${DB_USERNAME:acheimontador}
spring.datasource.password=${DB_PASSWORD:acheimontador}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do Hibernate / JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Configuracoes da aplicacao e documentacao
springdoc.override-with-generic-response=false
spring.application.name=AcheiMontador

